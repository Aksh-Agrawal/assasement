[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-assessment-device"
dynamic = ["version"]
description = "Offline-first student assessment device prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43,<47",
    "httpx>=0.27,<1",
    "jsonschema>=4.23,<5",
    "packaging>=24,<27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]
gui = [
    # pygame-compatible distribution with CPython 3.14 wheels.
    "pygame-ce>=2.5,<3",
]
backend = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.9,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.34,<1",
]

[tool.setuptools.packages.find]
include = ["app*", "tools*"]

[tool.setuptools.dynamic]
version = {attr = "app.version.__version__"}

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "postgres: requires TEST_DATABASE_URL pointing to a dedicated PostgreSQL test database",
    "fault: deterministic file-backed fault-injection and recovery tests",
    "update: deterministic signed-update architecture tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]


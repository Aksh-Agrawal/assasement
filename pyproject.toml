[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-assessment-device"
dynamic = ["version"]
description = "Offline-first student assessment device prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43,<47",
    "httpx>=0.27,<1",
    "jsonschema>=4.23,<5",
    "packaging>=24,<27",
    "segno>=1.6,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]
gui = [
    # Primary Raspberry Pi presentation layer: Qt Quick / QML.
    "PySide6-Essentials>=6.6,<7",
]
qt = [
    # Compatibility extra for existing installs and automation.
    "PySide6-Essentials>=6.6,<7",
]
[tool.setuptools.packages.find]
include = ["app*", "tools*", "schemas"]

[tool.setuptools.package-data]
schemas = ["*.json"]
"app.data" = ["migrations/*.sql"]
"app.ui_qt" = ["qml/qmldir", "qml/*.qml", "qml/*/*.qml", "qml/icons/*.svg", "assets/*.svg", "assets/*/*.svg"]

[tool.setuptools.exclude-package-data]
tools = ["approve_pairing.py", "revoke_device.py"]

[tool.setuptools.dynamic]
version = {attr = "app.version.__version__"}

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "postgres: requires TEST_DATABASE_URL pointing to a dedicated PostgreSQL test database",
    "cloud_integration: temporary device/cloud integration tests requiring server source",
    "fault: deterministic file-backed fault-injection and recovery tests",
    "update: deterministic signed-update architecture tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

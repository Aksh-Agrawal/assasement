[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-assessment-development-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.9,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.34,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
markers = [
    "postgres: requires TEST_DATABASE_URL pointing to a dedicated PostgreSQL test database",
]

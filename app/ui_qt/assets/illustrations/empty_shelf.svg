  <rect x="39" y="52" width="10" height="46" rx="2" fill="#C76848" stroke="#23302D" stroke-width="1.5"/>
  <rect x="51" y="40" width="14" height="58" rx="2" fill="#D5A64A" stroke="#23302D" stroke-width="1.5"/>

  <!-- Antique Table Globe (Middle right) -->

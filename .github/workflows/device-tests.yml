name: Device software tests
on: [push, pull_request]
jobs:
  device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-xinerama0
      - name: Install device package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,gui]'
      - name: Run lint and tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ruff check .
          pytest -q
